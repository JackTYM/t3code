name: Fork binaries

# Builds installable macOS, Windows and iOS binaries from any branch of this
# fork. The upstream Release workflow cannot run here: it reads the production
# relay's state from T3's Cloudflare account and publishes to npm, Vercel,
# Discord and the AUR. This one has no such dependencies.
#
# Nothing is signed unless signing secrets exist (see release-desktop.yml), so
# macOS and Windows installers are unsigned and the iOS IPA is for re-signing
# yourself. The relay/Clerk values baked in are the public ones from
# .env.example, the same ones the PR preview builds use.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build. Defaults to the ref this workflow was dispatched on."
        required: false
        type: string
      targets:
        description: "What to build. Windows also builds the Linux CLI archive it embeds."
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - ios
      publish:
        description: "Publish a GitHub Release with every installer and the updater manifests. Only applies to targets=all, so a release never lacks a platform."
        required: false
        type: boolean
        default: false

permissions:
  # release-desktop.yml's Windows build lists this run's artifacts.
  actions: read
  contents: read

concurrency:
  group: fork-binaries-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The platform-independent JS (server, web client, Electron main) is built
  # once and packaged by every desktop job.
  bundle:
    name: Build JS bundle
    if: inputs.targets != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      clerk_publishable_key: ${{ steps.source.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.source.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.source.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.source.outputs.relay_url }}
    steps:
      # Anonymous fetch: checkout's credential cleanup fails on the orphaned
      # gitlinks in the vendored .repos tree, which is excluded anyway.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The packaging jobs receive the same version and public values as
      # inputs, so every installer matches the bundle built here.
      - id: source
        name: Resolve version and public configuration
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          version="${base_version}-fork.${GITHUB_RUN_NUMBER}"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env

          {
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          for key in clerk_publishable_key:T3CODE_CLERK_PUBLISHABLE_KEY clerk_jwt_template:T3CODE_CLERK_JWT_TEMPLATE clerk_cli_oauth_client_id:T3CODE_CLERK_CLI_OAUTH_CLIENT_ID relay_url:T3CODE_RELAY_URL; do
            output="${key%%:*}"
            name="${key##*:}"
            value="$(sed -n "s/^${name}=//p" .env.example | head -n 1)"
            if [[ ! "$value" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
              echo "$name is missing or malformed in .env.example." >&2
              exit 1
            fi
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          done

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # Same layout as the release workflow's js-bundle, so release-desktop.yml
      # packages it unchanged.
      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      # Servers download this zip to swap their web UI without a reinstall. It
      # is cut here, not in the release job, because that job has no checkout
      # or Node: the production web branding that the desktop jobs apply to
      # this same client (apply-web-brand-assets.ts) has to be applied to the
      # zip too, or an updated server would serve the development favicons that
      # build:desktop leaves in dist/client. The zip holds the client's
      # contents at its root.
      - name: Build the UI bundle
        if: ${{ inputs.publish && inputs.targets == 'all' }}
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          client="$RUNNER_TEMP/ui-client"
          out="$RUNNER_TEMP/ui-bundle"
          asset="ui-bundle-${VERSION}.zip"
          test -f apps/server/dist/client/ui-compat.json
          mkdir -p "$out"
          cp -R apps/server/dist/client "$client"
          node scripts/apply-web-brand-assets.ts production "$client"
          (cd "$client" && zip -qrX "$out/$asset" .)
          node scripts/make-ui-bundle-manifest.ts \
            --client-dir "$client" --zip "$out/$asset" --version "$VERSION" --sha "$SHA" \
            > "$out/ui-bundle.json"
          cat "$out/ui-bundle.json"

      - name: Upload UI bundle
        if: ${{ inputs.publish && inputs.targets == 'all' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-bundle
          path: ${{ runner.temp }}/ui-bundle/*
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (inputs.targets == 'all' || inputs.targets == 'macos') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ needs.bundle.outputs.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}
      label: macOS arm64
      runner: macos-latest
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  # The Windows build embeds this job's CLI archive as its WSL runtime and
  # waits for it by job name, so the label must stay "Linux x64".
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (inputs.targets == 'all' || inputs.targets == 'windows') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ needs.bundle.outputs.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (inputs.targets == 'all' || inputs.targets == 'windows') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ needs.bundle.outputs.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}
      label: Windows x64
      runner: windows-latest
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  # Unsigned on purpose: the IPA is re-signed by hand, and an Apple signing
  # identity is not needed to produce it. The widget extension uses iOS 27.1
  # APIs, so this needs Xcode 27.1, which only the xcode-27 runner image has.
  ios_unsigned:
    name: iOS unsigned IPA
    if: inputs.targets == 'all' || inputs.targets == 'ios'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      # The group the re-signing profile grants. The widget reads shared state
      # from it, so a stale value gives a blank Live Activity card.
      APP_GROUP: ${{ vars.IOS_APP_GROUP || 'group.22fa696a256864dd.1' }}
      # Where the app looks for JS updates (see docs/user/updating.md). Unset
      # means updates are off, so the build never asks T3's Expo project.
      T3CODE_MOBILE_UPDATES_URL: ${{ vars.T3CODE_MOBILE_UPDATES_URL }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      # expo shells out to pnpm, which vp installs under its own prefix.
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Prebuild the iOS project
        working-directory: apps/mobile
        run: |
          cp ../../.env.example ../../.env
          ./node_modules/.bin/expo prebuild --clean --platform ios

      - name: Archive without signing
        working-directory: apps/mobile
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/T3Code.xcworkspace -scheme T3Code -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::error::xcodebuild archive failed; the last lines of its log follow."
              tail -n 200 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            }

      # Built from the archived app's own runtime version: an update whose
      # runtime version differs from the installed build is ignored.
      - id: ota
        name: Build the JS update
        if: ${{ env.T3CODE_MOBILE_UPDATES_URL != '' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/T3Code.xcarchive/Products/Applications/T3Code.app"
          runtime="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$app/Expo.plist")"
          # The fingerprint policy stores a pointer; the real value is the file's contents.
          if [[ "$runtime" == file:* ]]; then
            runtime="$(tr -d '[:space:]' < "$app/EXUpdates.bundle/${runtime#file:}")"
          fi
          [[ "$runtime" =~ ^[A-Za-z0-9._-]+$ && "$runtime" != file:* ]] || { echo "Bad runtime version: $runtime" >&2; exit 1; }
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          pages="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          ./node_modules/.bin/expo export --platform ios --output-dir "$RUNNER_TEMP/expo-dist"
          ./node_modules/.bin/expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node ../../scripts/make-ota-manifest.ts \
            --dist "$RUNNER_TEMP/expo-dist" --out "$RUNNER_TEMP/site/ota" \
            --runtime-version "$runtime" --base-url "$pages/ota" \
            --expo-config "$RUNNER_TEMP/expo-config.json"
          cat "$RUNNER_TEMP/site/ota/ios/manifest.json"

      - id: package
        name: Package the IPAs
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/T3Code.xcarchive/Products/Applications/T3Code.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          name="T3Code-${version}-$(git rev-parse --short=9 HEAD)"
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out" "$RUNNER_TEMP/pkg/Payload"
          cp -R "$app" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$out/${name}-unsigned.ipa" Payload)
          # The ref being built predates this script, so take it from the
          # commit that owns this workflow.
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "FETCH_HEAD:.github/scripts/patch-ipa-app-group.sh" > "$RUNNER_TEMP/patch-ipa-app-group.sh"
          bash "$RUNNER_TEMP/patch-ipa-app-group.sh" "$out/${name}-unsigned.ipa" "$out/${name}-unsigned-appgroup.ipa" "$APP_GROUP"
          ls -la "$out"
          # The Feather source is cut later, in a job that has no Xcode tools.
          mkdir -p "$RUNNER_TEMP/meta"
          node -e '
            const [bundleId, ipaName, ipaSize] = process.argv.slice(1);
            console.log(JSON.stringify({ bundleId, ipaName, ipaSize: Number(ipaSize) }));
          ' "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" \
            "${name}-unsigned-appgroup.ipa" "$(stat -f %z "$out/${name}-unsigned-appgroup.ipa")" \
            > "$RUNNER_TEMP/meta/ios-meta.json"
          cat "$RUNNER_TEMP/meta/ios-meta.json"

      - name: Upload IPAs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-meta
          path: ${{ runner.temp }}/meta/ios-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload JS update
        if: ${{ steps.ota.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ota-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # Desktop apps built here read their updates from this repository's latest
  # release (GITHUB_REPOSITORY is baked into the build), so the release must
  # carry electron-builder's manifests under the names electron-updater asks
  # for. Unsigned macOS builds still cannot install an update on their own.
  release:
    name: Publish GitHub Release
    needs: [bundle, desktop_mac_arm64, desktop_linux_x64, desktop_win_x64, ios_unsigned]
    if: ${{ !cancelled() && inputs.publish && inputs.targets == 'all' && needs.bundle.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_win_x64.result == 'success' && needs.ios_unsigned.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets

      - name: Download iOS IPAs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-unsigned
          path: assets

      # ui-bundle-<version>.zip and ui-bundle.json; the publish step attaches
      # everything in assets/, so they ride along with the installers.
      - name: Download UI bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-bundle
          path: assets

      # The Windows job suffixes its manifest with the arch because two arch
      # jobs would otherwise upload the same name. With one arch there is
      # nothing to merge, so it only needs its channel name back.
      - name: Name the updater manifests
        working-directory: assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f builder-debug.yml
          mv latest-win-x64.yml latest.yml
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            [[ -f "$manifest" ]] || { echo "Missing updater manifest $manifest" >&2; exit 1; }
          done
          ls -la

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
          SHA: ${{ needs.bundle.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "T3 Code fork ${VERSION}" \
            --notes "Built from ${SHA}. macOS and Windows installers are unsigned; the IPAs are unsigned too, and the -appgroup one is patched for re-signing." \
            --latest

  # The Feather source and the JS update live on GitHub Pages, so installed
  # apps can find them without a server. Pages keeps only the latest, while
  # the IPAs stay on the release. Only main can deploy to the Pages environment.
  pages:
    name: Publish mobile updates
    needs: [bundle, release, ios_unsigned]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.bundle.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Download IPA metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-meta
          path: meta

      # Absent when no update URL is configured; the source is still published.
      - name: Download JS update
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ota-site
          path: site

      - name: Build the Feather source
        shell: bash
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          pages="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          ipa_name="$(node -p "require('./meta/ios-meta.json').ipaName")"
          node scripts/make-altstore-source.ts \
            --out site/source.json \
            --bundle-id "$(node -p "require('./meta/ios-meta.json').bundleId")" \
            --version "${VERSION}" \
            --ipa-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ipa_name}" \
            --ipa-size "$(node -p "require('./meta/ios-meta.json').ipaSize")" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-url "${pages}/source.json"
          cat site/source.json
          find site -maxdepth 3 | head -20

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
